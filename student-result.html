<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assessment Result | School Assessment Platform</title>
<style>
:root{--ink:#17233b;--muted:#64748b;--line:#dfe6f1;--brand:#4338ca;--bg:#f3f6fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}header{background:linear-gradient(120deg,#18264a,#3730a3);color:#fff;padding:22px}header>div,main{max-width:980px;margin:auto}header a{color:#e0e7ff}main{padding:20px 14px 40px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,26px);margin-bottom:16px}.muted{color:var(--muted);font-size:14px}.status{padding:12px 14px;border-radius:10px;background:#f1f5f9;margin-bottom:15px}.bad{background:#fef2f2;color:#991b1b}.score{font-size:clamp(32px,7vw,48px);font-weight:850;color:#3730a3;line-height:1.2}.track{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:10px 0}.track span{display:block;height:100%;background:#4f46e5}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:10px 0}.row:last-child{border:0}.btn{display:inline-block;background:#eef2ff;color:#3730a3;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:700;margin:8px 8px 0 0}
</style><style>.student-footer-nav{max-width:1100px;margin:24px auto 0;padding:14px 16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.student-footer-nav a{display:inline-block;padding:10px 15px;border-radius:10px;background:#eef2ff;color:#3730a3;text-decoration:none;font-weight:700;font-size:14px}.student-footer-nav a:first-child{background:#4338ca;color:white}@media(max-width:560px){.student-footer-nav{display:grid;grid-template-columns:1fr}.student-footer-nav a{text-align:center}}</style></head><body><header><div><a href="student-login.html">← Student Dashboard</a><h1 id="title">Assessment Result</h1><p id="subtitle">Your saved result</p></div></header><main><div id="status" class="status">Loading your result…</div><section id="result" class="card" hidden></section><nav class="student-footer-nav" aria-label="Student navigation"><a href="student-login.html">← Back to Student Dashboard</a><a href="student-portal.html">Assigned Tests</a><a href="student-portal.html?view=open">Open Tests</a></nav></main>
<script>
const $=id=>document.getElementById(id),TOKEN='sap_student_session_v1',CONFIG='sap_supabase_public_config_v1';
let cfg={},token=sessionStorage.getItem(TOKEN)||localStorage.getItem(TOKEN)||'';
try{cfg=JSON.parse(localStorage.getItem(CONFIG)||'{}')}catch{}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function status(msg,bad=false){$('status').textContent=msg;$('status').className='status'+(bad?' bad':'')}
async function load(){try{if(!token)throw Error('Your sign-in has expired. Please sign in again.');if(!cfg.url||!cfg.key)throw Error('School database settings are missing on this device. Please contact your teacher.');const p=new URLSearchParams(location.search),type=p.get('type'),id=p.get('id');if(!id||!['diagnostic','attempt'].includes(type))throw Error('This result link is incomplete.');const r=await fetch(cfg.url+'/functions/v1/student-assessment',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.key,'Authorization':'Bearer '+token},body:JSON.stringify({action:'student-result',resultType:type,resultId:id})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load this result.');render(d.result,type)}catch(e){status(e.message,true)}}
function render(r,type){const host=$('result');host.hidden=false;$('status').textContent='Saved result loaded.';$('title').textContent=type==='diagnostic'?(r.report?.testName||'Grammar Diagnostic'):(r.assessments?.title||'Assessment Result');$('subtitle').textContent='Completed '+(r.completed_at?new Date(r.completed_at).toLocaleString():'');const score=Number(type==='diagnostic'?r.overall_percent:r.score_percent);let html='<div class="score">'+(Number.isFinite(score)?score+'%':'Score unavailable')+'</div><div class="track"><span style="width:'+Math.max(0,Math.min(100,Number.isFinite(score)?score:0))+'%"></span></div>';if(type==='diagnostic'){const s=r.report?.score||{};html+='<p>'+(s.correct??'—')+' correct out of '+(s.questionsAnswered??'—')+' questions answered.</p>';const skills=Array.isArray(r.report?.skills)?r.report.skills:[];if(skills.length){html+='<h2>Skill breakdown</h2>';for(const x of skills){const name=x.name||x.skill||x.title||'Grammar skill';const pct=Number(x.percent??x.scorePercent??x.score);html+='<div class="row"><span>'+esc(name)+'</span><strong>'+(Number.isFinite(pct)?esc(pct)+'%':esc(x.level||x.status||''))+'</strong></div>'}}}else{html+='<p><strong>'+(r.correct_count??'—')+'</strong> correct out of <strong>'+(r.questions_answered??'—')+'</strong> questions answered.</p>';const ans=r.result?.answers;if(Array.isArray(ans)&&ans.length){html+='<h2>Answer summary</h2>';ans.forEach((a,i)=>{html+='<div class="row"><span>Question '+(i+1)+'</span><strong>'+(a.correct?'Correct':'Incorrect')+(a.pointsEarned!==undefined?' · '+a.pointsEarned+' points':'')+'</strong></div>'})}}host.innerHTML=html}
load();
</script></body></html>
