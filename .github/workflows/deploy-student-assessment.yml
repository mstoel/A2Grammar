name: Deploy EduAssess student assessment function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/student-assessment/**"
      - ".github/workflows/deploy-student-assessment.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy student assessment function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy student-assessment --project-ref wappdiduuulrrnaczaxl --no-verify-jwt
