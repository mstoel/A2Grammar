name: Deploy Dictation Academy function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/dictation-academy/**"
      - ".github/workflows/deploy-dictation-academy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.20.12
      - name: Deploy Dictation Academy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy dictation-academy --project-ref wappdiduuulrrnaczaxl --no-verify-jwt
