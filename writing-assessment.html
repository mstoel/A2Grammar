<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Writing Assessment</title><style>body{font:16px system-ui;background:#f5f7fc;color:#17233b;margin:0}header{background:#202f5b;color:white;padding:24px}main{max-width:1000px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce3ef;border-radius:14px;padding:18px;margin:14px 0}label{display:block;font-weight:700;margin:10px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:90px}button{padding:10px 14px;border:0;border-radius:8px;background:#4f46e5;color:white;font-weight:700;cursor:pointer}.muted{color:#64748b;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:10px 0}.status{padding:10px;background:#eef2ff;border-radius:8px}.essay{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:8px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><header><a href="teacher-dashboard.html" style="color:white">Teacher Dashboard</a> · <a href="assessment-builder.html" style="color:white">Assessment Builder</a><h1>Writing Assessment</h1><p>Create class writing tasks and mark submitted essays.</p></header><main><div id="status" class="status">Loading teacher session…</div><section id="login" class="card" hidden><h2>Teacher sign-in</h2><label>Project URL<input id="url"></label><label>Publishable key<input id="key" type="password"></label><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button id="connect">Connect</button> <button id="signin">Sign in</button></section><div id="app" hidden><section class="card"><h2>School and class</h2><div class="row"><label>School<select id="school"></select></label><label>Class<select id="class"></select></label></div></section><section class="card"><h2>Create writing assignment</h2><label>Title<input id="title" placeholder="A memorable day"></label><label>Prompt<textarea id="prompt"></textarea></label><label>Instructions<textarea id="instructions"></textarea></label><div class="row"><label>Minimum words<input id="min" type="number" value="200" min="0"></label><label>Maximum words (0 = none)<input id="max" type="number" value="0" min="0"></label></div><div class="row"><label>Due date (optional)<input id="due" type="datetime-local"></label><label>Status<select id="pub"><option value="draft">Draft</option><option value="published">Publish to class</option></select></label></div><button id="save">Save assignment</button></section><section class="card"><h2>Assignments</h2><div id="assignments">Choose a class.</div></section><section class="card"><h2>Student submissions</h2><div id="submissions">Choose a class.</div></section><section id="review" class="card" hidden><h2 id="reviewTitle">Review essay</h2><div id="essay" class="essay"></div><div class="row"><label>Ideas / content (0–25)<input id="s1" type="number" min="0" max="25" value="0"></label><label>Organisation (0–25)<input id="s2" type="number" min="0" max="25" value="0"></label><label>Grammar / vocabulary (0–25)<input id="s3" type="number" min="0" max="25" value="0"></label><label>Mechanics (0–25)<input id="s4" type="number" min="0" max="25" value="0"></label></div><p>Total: <strong id="total">0</strong>/100</p><label>Teacher feedback<textarea id="feedback"></textarea></label><button id="mark">Save teacher review</button></section></div></main><script type="module">
const $=id=>document.getElementById(id),cfgKey='sap_supabase_public_config_v1';let db,user,schools=[],classes=[],activeSchool,activeClass,selected;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(s){$('status').textContent=s}async function setup(){let c={};try{c=JSON.parse(localStorage.getItem(cfgKey)||'{}')}catch{}if(c.url&&c.key){$('url').value=c.url;$('key').value=c.key;const m=await import('https://esm.sh/@supabase/supabase-js@2');db=m.createClient(c.url,c.key);const x=await db.auth.getSession();user=x.data.session?.user;if(user){$('app').hidden=false;await loadSchools();say('Signed in as '+user.email);return}}$('login').hidden=false;say('Connect and sign in with your teacher account.')}async function connect(){const m=await import('https://esm.sh/@supabase/supabase-js@2');db=m.createClient($('url').value.trim(),$('key').value.trim());localStorage.setItem(cfgKey,JSON.stringify({url:$('url').value.trim(),key:$('key').value.trim()}));say('Connected. Now sign in.')}async function signin(){if(!db)await connect();const x=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(x.error)throw x.error;user=x.data.user;$('login').hidden=true;$('app').hidden=false;await loadSchools();say('Signed in.')}async function loadSchools(){const x=await db.from('school_memberships').select('school_id,role,schools(id,name)').eq('user_id',user.id);if(x.error)throw x.error;schools=(x.data||[]).filter(m=>m.schools).map(m=>m.schools);$('school').innerHTML=schools.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('');if(schools.length){$('school').value=schools[0].id;await loadClasses()}}async function loadClasses(){activeSchool=schools.find(s=>s.id===$('school').value);const x=await db.from('classes').select('id,name').eq('school_id',activeSchool.id).eq('is_active',true).order('name');if(x.error)throw x.error;classes=x.data||[];$('class').innerHTML=classes.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');await refresh()}async function refresh(){activeClass=classes.find(c=>c.id===$('class').value);if(!activeClass){$('assignments').textContent='No active classes found.';return}const a=await db.from('writing_assignments').select('*').eq('school_id',activeSchool.id).eq('class_id',activeClass.id).order('created_at',{ascending:false});if(a.error)throw a.error;$('assignments').innerHTML=(a.data||[]).map(r=>'<div class="item"><strong>'+esc(r.title)+'</strong> · '+esc(r.status)+'<p>'+esc(r.prompt)+'</p><button data-toggle="'+r.id+'" data-status="'+(r.status==='published'?'draft':'published')+'">'+(r.status==='published'?'Unpublish':'Publish')+'</button> <button data-delete="'+r.id+'">Delete</button></div>').join('')||'No writing assignments yet.';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const z=await db.from('writing_assignments').update({status:b.dataset.status,updated_at:new Date().toISOString()}).eq('id',b.dataset.toggle);if(z.error)throw z.error;await refresh()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this assignment and its submissions?'))return;const z=await db.from('writing_assignments').delete().eq('id',b.dataset.delete);if(z.error)throw z.error;await refresh()});const s=await db.from('writing_submissions').select('id,assignment_id,student_id,draft_text,submitted_text,word_count,status,submitted_at,teacher_scores,teacher_feedback,students(student_code,display_name),writing_assignments(title)').eq('school_id',activeSchool.id).eq('class_id',activeClass.id).order('updated_at',{ascending:false});if(s.error)throw s.error;window.subRows=s.data||[];$('submissions').innerHTML=window.subRows.map(r=>'<div class="item"><strong>'+esc(r.students?.display_name||r.students?.student_code)+' — '+esc(r.writing_assignments?.title)+'</strong><p>'+r.word_count+' words · '+esc(r.status)+'</p><button data-review="'+r.id+'">Review</button></div>').join('')||'No submissions yet.';document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>openReview(window.subRows.find(r=>r.id===b.dataset.review)))}async function saveAssignment(){if(!activeSchool||!activeClass)throw Error('Choose a school and class.');const title=$('title').value.trim(),prompt=$('prompt').value.trim(),min=Number($('min').value)||0,max=Number($('max').value)||0;if(!title||!prompt)throw Error('Enter a title and prompt.');if(max&&max<min)throw Error('Maximum words cannot be lower than minimum.');const x=await db.from('writing_assignments').insert({school_id:activeSchool.id,class_id:activeClass.id,created_by:user.id,title,prompt,instructions:$('instructions').value.trim(),rubric_key:'informative-100',rubric:[{name:'Ideas & content',max:25},{name:'Organisation',max:25},{name:'Grammar & vocabulary',max:25},{name:'Mechanics',max:25}],min_words:min,max_words:max,status:$('pub').value,due_at:$('due').value?new Date($('due').value).toISOString():null});if(x.error)throw x.error;$('title').value='';$('prompt').value='';$('instructions').value='';say('Assignment saved.');await refresh()}function openReview(r){selected=r;$('review').hidden=false;$('reviewTitle').textContent=(r.students?.display_name||r.students?.student_code)+' — '+r.writing_assignments?.title;$('essay').textContent=r.submitted_text||r.draft_text||'(Empty draft)';const s=r.teacher_scores||{};$('s1').value=s.ideas||0;$('s2').value=s.organisation||0;$('s3').value=s.grammar||0;$('s4').value=s.mechanics||0;$('feedback').value=r.teacher_feedback||'';total();$('review').scrollIntoView({behavior:'smooth'})}function total(){$('total').textContent=['s1','s2','s3','s4'].reduce((n,id)=>n+Math.min(25,Math.max(0,Number($(id).value)||0)),0)}async function saveReview(){if(!selected)return;const scores={ideas:Number($('s1').value)||0,organisation:Number($('s2').value)||0,grammar:Number($('s3').value)||0,mechanics:Number($('s4').value)||0,total:Number($('total').textContent),max:100};const x=await db.from('writing_submissions').update({teacher_scores:scores,teacher_feedback:$('feedback').value.trim(),status:'reviewed',reviewed_by:user.id,reviewed_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',selected.id);if(x.error)throw x.error;$('review').hidden=true;say('Teacher review saved.');await refresh()}$('connect').onclick=()=>connect().catch(e=>say(e.message));$('signin').onclick=()=>signin().catch(e=>say(e.message));$('school').onchange=()=>loadClasses().catch(e=>say(e.message));$('class').onchange=()=>refresh().catch(e=>say(e.message));$('save').onclick=()=>saveAssignment().catch(e=>say(e.message));$('mark').onclick=()=>saveReview().catch(e=>say(e.message));['s1','s2','s3','s4'].forEach(id=>$(id).addEventListener('input',total));setup().catch(e=>say('Setup error: '+e.message));
</script></body></html>
